<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <!-- google font attachment link -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
    rel="stylesheet">


  <title>Frontend Mentor | QR code component</title>

  <style>
    html{
      font-size: 16px;
    }
   
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root{
      --webpage-primary-background-color:  rgb(199, 222, 222);
      

    }
     html{
      font-family: 'Outfit', sans-serif;
    }
    body {
      width: 100%;
      height: 100vh;
      background-color: var(--webpage-primary-background-color);
    }
    .main-section {}

    .qr-container{
      width: min-content;
      height: auto;
      border: 2px solid black;
      margin: 50px auto;
      padding: 15px;
      border-radius: 10px;
      border: none;
      background-color: white;
      
    }
    /* .qr-container{
      margin: 0px auto; /*debug here  for making in the center
    } */
    .qr-container img{
      width: 350px;
      height: 350px;
      border-radius: 15px;
    }
    .qr-specification{
      padding: 25px;
      text-align: center;

      
    }
    .specification-head{
      padding: 10px 0px 10px 0px ;
      font-size: 1.5rem;

    }
    .specification-para{
      padding-top: 10px;
      color: gray;
      font-size: 1.2rem;
    }

    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>

  <main class="main-section">

    <section class="qr-container">

      <img src="./images/image-qr-code.png" alt="Qr bar code" class="qr-image">

      <article class="qr-specification">

        <h2 class="specification-head">
         Improve your front-end skills by building projects
          
        </h2>

        <p class="specification-para">
          Scan the QR code to visit frontend menttor and take your coding skill to the next level
        </p>
      </article>
    </section>
  </main>


  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Abhinav kumar</a>.
  </footer>

</body>

</html>
